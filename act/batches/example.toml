# 例：比較 B1〜B5 と同じ中身。`uv run python scripts/run_batch.py --config batches/example.toml --dry-run` で計画だけ見られる。
# 書かなかった鍵は既定値（data の seed 0・episodes 20・σ 0.0175・切り詰め 0.035・τ [0.02, 0.10]・state_mode lagged・env_variant full など）。
[batch]
description = "比較 B1〜B5 の再現（lr 1e-4・batch 32・20k step）"

[[run]]
name = "b1"
description = "今の観測（σ0.0175・τ0.02〜0.10）・lr1e-4・b32・20k"

[run.data]
seed = 0
episodes = 20
sigma_rad = 0.0175
clip_rad = 0.035
tau_range_s = [0.02, 0.10]
state_mode = "lagged"
env_variant = "full"

[run.train]
steps = 20000
batch_size = 32
save_freq = 1000
lr = 1e-4
lr_backbone = 1e-4
chunk_size = 50

[run.eval]
ckpts = [5000, 10000, 20000]

[run.export]
ckpts = [10000, 20000]
modes = ["open", "closed"]
formats = ["npz", "yaml"]

[[run]]
name = "b2"
description = "強いばらつき（σ0.10・±0.30・τ0.02〜0.25）・lr1e-4・b32・20k"

[run.data]
sigma_rad = 0.10
clip_rad = 0.30
tau_range_s = [0.02, 0.25]

[run.train]
steps = 20000
batch_size = 32
save_freq = 1000
lr = 1e-4
lr_backbone = 1e-4

[run.eval]
ckpts = [5000, 10000, 20000]

[run.export]
ckpts = [10000, 20000]
modes = ["open", "closed"]
formats = ["npz", "yaml"]

[[run]]
name = "b3"
description = "state 定数（初期姿勢）・lr1e-4・b32・20k"

[run.data]
state_mode = "constant"

[run.train]
steps = 20000
batch_size = 32
save_freq = 1000
lr = 1e-4
lr_backbone = 1e-4

[run.eval]
ckpts = [5000, 10000, 20000]

[run.export]
ckpts = [10000, 20000]
modes = ["open", "closed"]
formats = ["npz", "yaml"]

[[run]]
name = "b4"
description = "B2 のデータ・chunk100・lr1e-4・b32・20k"

[run.data]
sigma_rad = 0.10
clip_rad = 0.30
tau_range_s = [0.02, 0.25]

[run.train]
steps = 20000
batch_size = 32
save_freq = 1000
lr = 1e-4
lr_backbone = 1e-4
chunk_size = 100

[run.eval]
ckpts = [5000, 10000, 20000]

[run.export]
ckpts = [10000, 20000]
modes = ["open", "closed"]
formats = ["npz", "yaml"]

[[run]]
name = "b5"
description = "state 定数＋拍位相定数（進行度だけ）・lr1e-4・b32・20k"

[run.data]
state_mode = "constant"
env_variant = "no_phase"

[run.train]
steps = 20000
batch_size = 32
save_freq = 1000
lr = 1e-4
lr_backbone = 1e-4

[run.eval]
ckpts = [5000, 10000, 20000]

[run.export]
ckpts = [10000, 20000]
modes = ["open", "closed"]
formats = ["npz", "yaml"]
